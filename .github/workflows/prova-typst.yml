name: Compila Typst e Pubblica Sito

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ottieni il codice sorgente
        uses: actions/checkout@v4

      - name: Configura Typst
        uses: typst-community/setup-typst@v3

      - name: Compila i file Typst direttamente nella cartella del sito
        run: |
          # ⚙️ INSERISCI QUI IL NOME DELLA CARTELLA DEL TUO SITO (es. "sito", "docs", "public")
          SITE_DIR="sito"
          
          echo "Inizio compilazione dei file Typst dentro la cartella del sito: $SITE_DIR..."
          
          while IFS= read -r -d '' file; do
            # Genera il percorso del PDF corrispondente dentro la cartella del sito
            # (mantiene la stessa struttura di cartelle del file .typ sorgente)
            out="${SITE_DIR}/${file#./}"
            out="${out%.typ}.pdf"
            
            # Crea la cartella di destinazione se non esiste
            mkdir -p "$(dirname "$out")"
            
            echo "Compilazione: $file -> $out"
            typst compile --root . "$file" "$out"
          done < <(find . -name "*.typ" -not -path "./.*" -not -path "./${SITE_DIR}/*" -print0)

      - name: Carica la cartella del sito come artifact per GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: swe-dashboard # <-- Inserisci qui lo stesso nome della cartella del tuo sito

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
