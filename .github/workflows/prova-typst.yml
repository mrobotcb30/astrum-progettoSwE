name: Compila Typst e Pubblica Sito

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_DIR: swe-dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v3

      # swe-dashboard/docs/RTB/foo.typ -> swe-dashboard/public/docs/RTB/foo.pdf
      - name: Compila i documenti Typst
        run: |
          cd "$SITE_DIR"
          find docs -name '*.typ' ! -path 'docs/_template/*' | while read -r f; do
            out="public/${f%.typ}.pdf"
            mkdir -p "$(dirname "$out")"
            echo "Compilazione: $f -> $out"
            typst compile --root docs "$f" "$out"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.SITE_DIR }}/package-lock.json

      - name: Installa dipendenze
        working-directory: ${{ env.SITE_DIR }}
        run: npm ci

      - name: Build del sito
        working-directory: ${{ env.SITE_DIR }}
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
