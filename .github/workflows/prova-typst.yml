name: Compila e pubblica PDF

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v3

      - name: Compila i documenti
        run: |
          while IFS= read -r -d '' f; do
            out="_site/docs/${f#./}"
            out="${out%.typ}.pdf"
            mkdir -p "$(dirname "$out")"
            echo "Compilo $f -> $out"
            typst compile --root . --font-path . --ignore-system-fonts "$f" "$out"
          done < <(find . -name '*.typ' -not -path './.*' -not -path './Template/*' -not -name '_*' -print0)

          echo "PDF generati:"; find _site -name '*.pdf'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
