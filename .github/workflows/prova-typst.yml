name: Compila Typst e Pubblica Sito

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_DIR: swe-dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessario per leggere la data reale degli ultimi commit sui file

      - uses: typst-community/setup-typst@v3

      # swe-dashboard/docs/RTB/foo.typ -> swe-dashboard/public/docs/RTB/foo.pdf
      - name: Compila i documenti Typst
        run: |
          while IFS= read -r -d '' f; do
            # Usa la variabile d'ambiente SITE_DIR per puntare alla cartella public
            out="$SITE_DIR/public/docs/${f#./}"
            out="${out%.typ}.pdf"
            mkdir -p "$(dirname "$out")"
            echo "Compilo $f -> $out"
            typst compile --root . --font-path . --ignore-system-fonts "$f" "$out"
          done < <(find . -name '*.typ' -not -path './.*' -not -path './Template/*' -not -name '_*' -print0)

          echo "PDF generati:"; find "$SITE_DIR/public/docs" -name '*.pdf'

      - name: Genera index.html
        run: |
          REPO_DIR="$PWD"
          DOCS_DIR="$REPO_DIR/$SITE_DIR/public/docs"
          mkdir -p "$DOCS_DIR"

          NOW=$(date +%s)
          SEVEN_DAYS_AGO=$((NOW - 7 * 86400))

          cd "$DOCS_DIR"

          echo '<h1>Indice dei file</h1>' > index.html

          current_dir=""

          find . -type f -name '*.pdf' | sort | while read -r f; do
            pdf_rel="${f#./}"
            dir_name=$(dirname "$pdf_rel")
            file_name=$(basename "$pdf_rel")
            date_tag=""

            # Quando cambia cartella, chiude la lista precedente e ne apre una nuova con il titolo della cartella
            if [ "$dir_name" != "$current_dir" ]; then
              if [ -n "$current_dir" ]; then
                echo '</ul>' >> index.html
              fi
              current_dir="$dir_name"
              
              if [ "$dir_name" = "." ]; then
                echo '<h3>/</h3>' >> index.html
              else
                echo "<h3>$dir_name/</h3>" >> index.html
              fi
              echo '<ul style="list-style-type: none; padding-left: 1rem;">' >> index.html
            fi

            # Calcolo data
            if [ -f "$REPO_DIR/$typ_rel" ]; then
              typ_rel="${pdf_rel%.pdf}.typ"
              last_commit=$(git -C "$REPO_DIR" log -1 --format="%ct" -- "$typ_rel")
              last_date=$(git -C "$REPO_DIR" log -1 --date=format:'%d/%m/%Y' --format="%cd" -- "$typ_rel")

              if [ -n "$last_commit" ]; then
                if [ "$last_commit" -gt "$SEVEN_DAYS_AGO" ]; then
                  date_tag="<strong>$last_date</strong>"
                else
                  date_tag="$last_date"
                fi
              fi
            fi

            # Stampa solo il nome del file, mantenendo il link corretto al percorso completo
            echo "<li>$date_tag - <a href=\"$pdf_rel\">$file_name</a></li>" >> index.html
          done

          # Chiude l'ultimo <ul> se sono stati trovati file
          if [ -n "$current_dir" ]; then
            echo '</ul>' >> index.html
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.SITE_DIR }}/package-lock.json

      - name: Installa dipendenze
        working-directory: ${{ env.SITE_DIR }}
        run: npm ci

      - name: Build del sito
        working-directory: ${{ env.SITE_DIR }}
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
